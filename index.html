<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidereal Zodiac Analog Astroclock</title>
  <style>
    :root {
      --bg-color: #0b0d17;
      --accent-gold: #f3ba2f;
      --accent-silver: #00f0ff;
      --accent-coral: #ff4757;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(30, 40, 85, 0.5) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(20, 15, 40, 0.5) 0%, transparent 50%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Top Left HUD */
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(11, 13, 23, 0.5);
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Interactive Date Time Scroller */
    .dt-grid {
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .dt-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .dt-col button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
    }

    .dt-col button:hover {
      color: var(--accent-silver);
    }

    .dt-val {
      font-family: monospace;
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin: 2px 0;
      font-variant-numeric: tabular-nums;
    }

    .dt-sep {
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .btn-reset {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-size: 1.2rem;
      margin-left: 8px;
      transition: transform 0.3s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-reset:hover {
      transform: rotate(-90deg);
      color: var(--accent-gold);
    }

    /* Sub-texts Readout */
    .sub-texts {
      display: flex;
      gap: 10px;
      font-family: Roboto;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .sub-texts span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Clock Wrapper (Full Viewport Fit) */
    .clock-wrapper {
      position: relative;
      width: 100vmin;
      height: 100vmin;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 15px 35px rgba(0,0,0,0.6));
      transition: all 0.3s ease;
    }

    /* Elements Zodiac Ring Colors */
    .fire-sign { fill: rgba(255, 71, 87, 0.08); }
    .earth-sign { fill: rgba(46, 213, 115, 0.08); }
    .air-sign { fill: rgba(22, 160, 133, 0.08); }
    .water-sign { fill: rgba(30, 144, 255, 0.08); }

    /* SVG Glow Filters */
    .glow-sun { filter: drop-shadow(0px 0px 6px #f3ba2f); }
    .glow-moon { filter: drop-shadow(0px 0px 6px #00f0ff); }
    .glow-asc { filter: drop-shadow(0px 0px 6px #ff4757); }
    
    .ml-text { font-family: "Malayalam MN", "Kartika", sans-serif; transition: all 0.2s ease;}
    path, line, text { transition: all 0.2s ease; }
  </style>
</head>
<body>

  <!-- Top Left UI -->
  <div class="hud">
    <div class="dt-grid">
      <div class="dt-col" data-unit="year">
        <button class="btn-plus">+</button>
        <span class="dt-val" id="val-year">2026</span>
        <button class="btn-minus">-</button>
      </div>
      <span class="dt-sep">/</span>
      <div class="dt-col" data-unit="month">
        <button class="btn-plus">+</button>
        <span class="dt-val" id="val-month">08</span>
        <button class="btn-minus">-</button>
      </div>
      <span class="dt-sep">/</span>
      <div class="dt-col" data-unit="day">
        <button class="btn-plus">+</button>
        <span class="dt-val" id="val-day">14</span>
        <button class="btn-minus">-</button>
      </div>
      <span class="dt-sep">&nbsp;&nbsp;</span>
      <div class="dt-col" data-unit="hour">
        <button class="btn-plus">+</button>
        <span class="dt-val" id="val-hour">09</span>
        <button class="btn-minus">-</button>
      </div>
      <span class="dt-sep">:</span>
      <div class="dt-col" data-unit="minute">
        <button class="btn-plus">+</button>
        <span class="dt-val" id="val-minute">14</span>
        <button class="btn-minus">-</button>
      </div>
      <span class="dt-sep">:</span>
      <div class="dt-col" data-unit="second">
        <button class="btn-plus">+</button>
        <span class="dt-val" id="val-second">22</span>
        <button class="btn-minus">-</button>
      </div>
      <button class="btn-reset" id="btn-live" title="Reset to Now">↺</button>
    </div>

    <!-- Live Positions & Ayanamsa Subtexts -->
    <div class="sub-texts">
      <span style="color: var(--accent-gold);">☉<span id="sun-pos">--</span></span>
      <span style="color: var(--accent-silver);">☽<span id="moon-pos">--</span></span>
      <span style="color: var(--accent-coral);">ASC<span id="asc-pos">--</span></span>
      <span style="color: var(--text-muted);">Aya:<span id="ayanamsha-val">--</span></span>
    </div>
  </div>

  <!-- SVG Circular Astroclock -->
  <div class="clock-wrapper">
    <svg id="astroclock" viewBox="-80 -80 960 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#181c38" />
          <stop offset="100%" stop-color="#0b0d17" />
        </radialGradient>
      </defs>

      <!-- Outer Background Circle -->
      <circle cx="400" cy="400" r="455" fill="url(#centerGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

      <!-- Rings Generated via JS -->
      <g id="time-ring"></g>
      <g id="month-ring"></g>
      <g id="zodiac-ring"></g>
      <g id="nakshatra-ring"></g>
      <g id="degree-ticks" stroke="rgba(255,255,255,0.2)" stroke-width="1"></g>

      <!-- Inner Wheel Divider -->
      <circle cx="400" cy="400" r="230" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
      <circle cx="400" cy="400" r="160" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

      <!-- Center Hub -->
      <circle cx="400" cy="400" r="8" fill="#e2e8f0" />

      <!-- Dynamic Celestial Hands -->
      <g id="hand-asc" class="glow-asc">
        <line x1="400" y1="400" x2="400" y2="12" stroke="#ff4757" stroke-width="2.5" stroke-dasharray="6,4" />
        <polygon points="400,-5 393,12 407,12" fill="#ff4757" />
      </g>
      <text id="asc-time-label" class="glow-asc" fill="#ff4757" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle">--:--:--</text>

      <g id="hand-sun" class="glow-sun">
        <line x1="400" y1="400" x2="400" y2="100" stroke="#f3ba2f" stroke-width="3" />
        <circle cx="400" cy="90" r="14" fill="#f3ba2f" />
        <circle cx="400" cy="90" r="6" fill="#0b0d17" />
      </g>

      <g id="hand-moon" class="glow-moon">
        <line x1="400" y1="400" x2="400" y2="130" stroke="#00f0ff" stroke-width="2.5" />
        <circle cx="400" cy="115" r="12" fill="#0b0d17" stroke="#00f0ff" stroke-width="1.5" />
        <path id="moon-phase-path" fill="#00f0ff" />
      </g>
    </svg>
  </div>

  <script>
    const ZODIAC_SIGNS = [
      { name: "Aries", symbol: "♈", element: "fire", mlMonth: "മേടം" },
      { name: "Taurus", symbol: "♉", element: "earth", mlMonth: "ഇടവം" },
      { name: "Gemini", symbol: "♊", element: "air", mlMonth: "മിഥുനം" },
      { name: "Cancer", symbol: "♋", element: "water", mlMonth: "കർക്കടകം" },
      { name: "Leo", symbol: "♌", element: "fire", mlMonth: "ചിങ്ങം" },
      { name: "Virgo", symbol: "♍", element: "earth", mlMonth: "കന്നി" },
      { name: "Libra", symbol: "♎", element: "air", mlMonth: "തുലാം" },
      { name: "Scorpio", symbol: "♏", element: "water", mlMonth: "വൃശ്ചികം" },
      { name: "Sagittarius", symbol: "♐", element: "fire", mlMonth: "ധനു" },
      { name: "Capricorn", symbol: "♑", element: "earth", mlMonth: "മകരം" },
      { name: "Aquarius", symbol: "♒", element: "air", mlMonth: "കുംഭം" },
      { name: "Pisces", symbol: "♓", element: "water", mlMonth: "മീനം" }
    ];

    const ML_NAKSHATRAS = [
      "അശ്വതി", "ഭരണി", "കാർത്തിക", "രോഹിണി", "മകയിരം", "തിരുവാതിര",
      "പുണർതം", "പൂയം", "ആയില്യം", "മകം", "പൂരം", "ഉത്രം",
      "അത്തം", "ചിത്തിര", "ചോതി", "വിശാഖം", "അനിഴം", "തൃക്കേട്ട",
      "മൂലം", "പൂരാടം", "ഉത്രാടം", "തിരുവോണം", "അവിട്ടം", "ചതയം",
      "പൂരുരുട്ടാതി", "ഉത്തൃട്ടാതി", "രേവതി"
    ];

    const MONTH_NAMES = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    // Fixed Context Location (Kozhikode, Kerala)
    const observerLat = 11.25;
    const observerLon = 75.78;
    
    let customTime = new Date();
    let isRealtime = true;
    let lastRingRotation = null;

    function getJulianDate(date) {
      return (date.getTime() / 86400000) + 2440587.5;
    }

    function getLahiriAyanamsha(jd) {
      const T = (jd - 2451545.0) / 36525.0;
      return 23.8560 + (1.39688 * T);
    }

    function getSunTropicalPosition(jd) {
      const d = jd - 2451545.0;
      let L = (280.466 + 0.98564736 * d) % 360;
      let g = (357.529 + 0.98560028 * d) % 360;
      if (L < 0) L += 360;
      if (g < 0) g += 360;
      const radG = g * Math.PI / 180;
      let lambda = L + 1.915 * Math.sin(radG) + 0.020 * Math.sin(2 * radG);
      return (lambda + 360) % 360;
    }

    function getMoonTropicalPosition(jd) {
      const d = jd - 2451545.0;
      let L = (218.316 + 13.176396 * d) % 360; 
      let M = (134.963 + 13.064993 * d) % 360; 
      let F = (93.272 + 13.229350 * d) % 360;  
      let D = (297.850 + 12.190749 * d) % 360; 
      const toRad = Math.PI / 180;
      let lambda = L
        + 6.289 * Math.sin(M * toRad)
        - 1.274 * Math.sin((M - 2*D) * toRad)
        + 0.658 * Math.sin(2*D * toRad)
        - 0.214 * Math.sin(2*M * toRad)
        - 0.185 * Math.sin(F * toRad)
        + 0.114 * Math.sin(2*F * toRad);
      return (lambda % 360 + 360) % 360;
    }

    function getAscendantTropical(jd, lat, lon) {
      const d = jd - 2451545.0;
      let gmst = (280.46061837 + 360.98564736629 * d) % 360;
      if (gmst < 0) gmst += 360;
      let lmst = (gmst + lon) % 360;
      if (lmst < 0) lmst += 360;
      const radLMST = lmst * Math.PI / 180;
      const radLat = lat * Math.PI / 180;
      const eps = (23.439291 - 0.0000004 * d) * Math.PI / 180; 
      const y = Math.cos(radLMST);
      const x = -Math.sin(radLMST) * Math.cos(eps) - Math.tan(radLat) * Math.sin(eps);
      let asc = Math.atan2(y, x) * 180 / Math.PI;
      return (asc % 360 + 360) % 360;
    }

    function getSunSiderealAtDate(year, month, date) {
      const d = new Date(Date.UTC(year, month, date, 12, 0, 0));
      const jd = getJulianDate(d);
      const ayanamsha = getLahiriAyanamsha(jd);
      return (getSunTropicalPosition(jd) - ayanamsha + 360) % 360;
    }

    function getSunriseHour(jd, lat, lon) {
      const d = jd - 2451545.0;
      const sunTrop = getSunTropicalPosition(jd);
      const eps = (23.439291 - 0.0000004 * d) * Math.PI / 180;
      const radSun = sunTrop * Math.PI / 180;
      
      const sinDelta = Math.sin(eps) * Math.sin(radSun);
      const delta = Math.asin(sinDelta);
      
      const radLat = lat * Math.PI / 180;
      const cosOmega0 = -Math.tan(radLat) * Math.tan(delta);
      
      let omega0 = 90;
      if (cosOmega0 >= 1) omega0 = 0;
      else if (cosOmega0 <= -1) omega0 = 180;
      else omega0 = Math.acos(cosOmega0) * (180 / Math.PI);
      
      let solarSunrise = 12 - (omega0 / 15);
      
      const meanLong = (280.460 + 0.9856474 * d) % 360;
      const radMeanLong = meanLong * Math.PI / 180;
      const eot = (-104.9 * Math.sin(radMeanLong) + 596.2 * Math.sin(2 * radMeanLong) + 4.3 * Math.sin(3 * radMeanLong) - 12.7 * Math.sin(4 * radMeanLong) - 429.3 * Math.cos(radMeanLong) - 2.0 * Math.cos(2 * radMeanLong)) / 3600;
      
      const stdMeridian = 82.5;
      const longCorrection = (stdMeridian - lon) / 15;
      
      return solarSunrise - eot + longCorrection;
    }

    function getMoonPhasePath(phaseAngle) {
      const r = 12;
      const cx = 400;
      const cy = 115;

      const rad = phaseAngle * Math.PI / 180;
      const cosA = Math.cos(rad);
      const rx = Math.abs(r * cosA);
      
      const waxing = phaseAngle <= 180;

      if (Math.abs(phaseAngle - 0) < 0.1 || Math.abs(phaseAngle - 360) < 0.1) {
        return ""; // New moon
      }
      if (Math.abs(phaseAngle - 180) < 0.1) {
        return `M ${cx - r} ${cy} A ${r} ${r} 0 1 0 ${cx + r} ${cy} A ${r} ${r} 0 1 0 ${cx - r} ${cy}`; // Full moon
      }

      let d = `M ${cx} ${cy - r} `;
      if (waxing) {
        d += `A ${r} ${r} 0 0 1 ${cx} ${cy + r} `;
        const sweep = phaseAngle < 90 ? 0 : 1;
        d += `A ${rx} ${r} 0 0 ${sweep} ${cx} ${cy - r} Z`;
      } else {
        d += `A ${r} ${r} 0 0 0 ${cx} ${cy + r} `;
        const sweep = phaseAngle < 270 ? 0 : 1;
        d += `A ${rx} ${r} 0 0 ${sweep} ${cx} ${cy - r} Z`;
      }
      return d;
    }

    function formatSiderealPos(deg) {
      const signIndex = Math.floor(deg / 30) % 12;
      const remDeg = deg % 30;
      const d = Math.floor(remDeg);
      const m = Math.floor((remDeg - d) * 60);
      const s = Math.round((((remDeg - d) * 60) - m) * 60);
      
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d)}°${pad(m)}'${pad(s)}"${ZODIAC_SIGNS[signIndex].symbol}`;
    }

    function polarToCartesian(cx, cy, r, deg) {
      const rad = (deg - 90) * Math.PI / 180;
      return {
        x: cx + (r * Math.cos(rad)),
        y: cy + (r * Math.sin(rad))
      };
    }

    function describeArc(cx, cy, rInner, rOuter, startAngle, endAngle) {
      const p1 = polarToCartesian(cx, cy, rOuter, startAngle);
      const p2 = polarToCartesian(cx, cy, rOuter, endAngle);
      const p3 = polarToCartesian(cx, cy, rInner, endAngle);
      const p4 = polarToCartesian(cx, cy, rInner, startAngle);
      const largeArc = (endAngle - startAngle) <= 180 ? "0" : "1";
      return [
        "M", p1.x, p1.y,
        "A", rOuter, rOuter, 0, largeArc, 1, p2.x, p2.y,
        "L", p3.x, p3.y,
        "A", rInner, rInner, 0, largeArc, 0, p4.x, p4.y,
        "Z"
      ].join(" ");
    }

    function buildZodiacClockUI() {
      const timeGroup = document.getElementById("time-ring");
      const monthGroup = document.getElementById("month-ring");
      const ringGroup = document.getElementById("zodiac-ring");
      const nakshatraGroup = document.getElementById("nakshatra-ring");
      const tickGroup = document.getElementById("degree-ticks");
      const cx = 400, cy = 400;

      const currentDate = new Date();
      const currentYear = currentDate.getFullYear();

      for (let i = 0; i < 24; i++) {
        const startDeg = i * 15;
        const endDeg = (i + 1) * 15;
        const midDeg = startDeg + 7.5;

        const bgPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        bgPath.setAttribute("id", `time-bg-${i}`);
        bgPath.setAttribute("d", describeArc(cx, cy, 405, 438, startDeg, endDeg));
        bgPath.setAttribute("fill", "rgba(255, 71, 87, 0)");
        timeGroup.appendChild(bgPath);

        const p1 = polarToCartesian(cx, cy, 405, startDeg);
        const p2 = polarToCartesian(cx, cy, 438, startDeg);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", p1.x);
        line.setAttribute("y1", p1.y);
        line.setAttribute("x2", p2.x);
        line.setAttribute("y2", p2.y);
        line.setAttribute("stroke", "rgba(255,255,255,0.25)");
        line.setAttribute("stroke-width", "1.5");
        timeGroup.appendChild(line);

        for(let j = 1; j < 12; j++) {
          const minDeg = startDeg + (j * 1.25);
          const isQuarter = (j % 3 === 0);
          const mp1 = polarToCartesian(cx, cy, 405, minDeg);
          const mp2 = polarToCartesian(cx, cy, isQuarter ? 418 : 412, minDeg);
          
          const mLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
          mLine.setAttribute("x1", mp1.x);
          mLine.setAttribute("y1", mp1.y);
          mLine.setAttribute("x2", mp2.x);
          mLine.setAttribute("y2", mp2.y);
          mLine.setAttribute("stroke", isQuarter ? "rgba(255,255,255,0.15)" : "rgba(255,255,255,0.08)");
          mLine.setAttribute("stroke-width", "1");
          timeGroup.appendChild(mLine);
        }

        const rot = midDeg > 90 && midDeg < 270 ? midDeg + 180 : midDeg;
        const textPos = polarToCartesian(cx, cy, 421.5, midDeg);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("id", `time-text-${i}`);
        text.setAttribute("x", textPos.x);
        text.setAttribute("y", textPos.y);
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "20");
        text.setAttribute("font-weight", "600");
        text.setAttribute("letter-spacing", "0.5");
        text.setAttribute("fill", "#94a3b8");
        text.setAttribute("transform", `rotate(${rot}, ${textPos.x}, ${textPos.y})`);
        text.textContent = String(i).padStart(2, '0');
        timeGroup.appendChild(text);
      }

      for (let i = 0; i < 12; i++) {
        let startDeg = getSunSiderealAtDate(currentYear, i, 1);
        let endDeg = getSunSiderealAtDate(currentYear, (i + 1) % 12, 1);
        if (endDeg < startDeg) endDeg += 360;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("id", `greg-month-path-${i}`);
        path.setAttribute("d", describeArc(cx, cy, 350, 390, startDeg, endDeg));
        monthGroup.appendChild(path);

        const midDeg = (startDeg + endDeg) / 2;
        const labelPos = polarToCartesian(cx, cy, 370, midDeg);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("id", `greg-month-text-${i}`);
        text.setAttribute("x", labelPos.x);
        text.setAttribute("y", labelPos.y); 
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "13");
        text.setAttribute("letter-spacing", "1");
        
        const rot = midDeg > 90 && midDeg < 270 ? midDeg + 180 : midDeg;
        text.setAttribute("transform", `rotate(${rot}, ${labelPos.x}, ${labelPos.y})`);
        text.textContent = MONTH_NAMES[i];
        monthGroup.appendChild(text);
      }

      for (let i = 0; i < 12; i++) {
        const startDeg = i * 30;
        const endDeg = (i + 1) * 30;
        const sign = ZODIAC_SIGNS[i];
        const midDeg = startDeg + 15;
        const rot = midDeg > 90 && midDeg < 270 ? midDeg + 180 : midDeg;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("id", `zod-path-${i}`);
        path.setAttribute("d", describeArc(cx, cy, 290, 350, startDeg, endDeg));
        path.setAttribute("class", `${sign.element}-sign`);
        ringGroup.appendChild(path);

        const symPos = polarToCartesian(cx, cy, 310, midDeg);
        const symText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        symText.setAttribute("id", `zod-sym-${i}`);
        symText.setAttribute("x", symPos.x);
        symText.setAttribute("y", symPos.y);
        symText.setAttribute("dominant-baseline", "middle");
        symText.setAttribute("text-anchor", "middle");
        symText.setAttribute("font-size", "22");
        symText.setAttribute("transform", `rotate(${rot}, ${symPos.x}, ${symPos.y})`);
        symText.textContent = sign.symbol;
        ringGroup.appendChild(symText);

        const mlPos = polarToCartesian(cx, cy, 335, midDeg);
        const mlText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        mlText.setAttribute("id", `zod-ml-${i}`);
        mlText.setAttribute("x", mlPos.x);
        mlText.setAttribute("y", mlPos.y);
        mlText.setAttribute("dominant-baseline", "middle");
        mlText.setAttribute("text-anchor", "middle");
        mlText.setAttribute("font-size", "12");
        mlText.setAttribute("class", "ml-text");
        mlText.setAttribute("transform", `rotate(${rot}, ${mlPos.x}, ${mlPos.y})`);
        mlText.textContent = sign.mlMonth;
        ringGroup.appendChild(mlText);
      }

      for (let i = 0; i < 27; i++) {
        const startDeg = i * (360 / 27);
        const endDeg = (i + 1) * (360 / 27);
        const midDeg = startDeg + (360 / 54);
        
        const bgPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        bgPath.setAttribute("id", `nak-bg-${i}`);
        bgPath.setAttribute("d", describeArc(cx, cy, 230, 275, startDeg, endDeg));
        bgPath.setAttribute("fill", "rgba(0, 240, 255, 0)");
        nakshatraGroup.appendChild(bgPath);

        const isGandanta = (i % 9 === 0);
        const pInner = polarToCartesian(cx, cy, isGandanta ? 220 : 230, startDeg);
        const pOuter = polarToCartesian(cx, cy, 275, startDeg);

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("id", `nak-line-${i}`);
        line.setAttribute("x1", pInner.x);
        line.setAttribute("y1", pInner.y);
        line.setAttribute("x2", pOuter.x);
        line.setAttribute("y2", pOuter.y);
        line.setAttribute("stroke", isGandanta ? "rgba(255,107,107,0.7)" : "rgba(0,240,255,0.2)");
        line.setAttribute("stroke-width", isGandanta ? "2.5" : "1");
        nakshatraGroup.appendChild(line);

        const rot = midDeg > 90 && midDeg < 270 ? midDeg + 180 : midDeg;
        const textPos = polarToCartesian(cx, cy, 252, midDeg);
        
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("id", `nak-text-${i}`);
        text.setAttribute("x", textPos.x);
        text.setAttribute("y", textPos.y);
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "10");
        text.setAttribute("font-weight", "500");
        text.setAttribute("class", "ml-text");
        text.setAttribute("transform", `rotate(${rot}, ${textPos.x}, ${textPos.y})`);
        text.textContent = ML_NAKSHATRAS[i];
        nakshatraGroup.appendChild(text);
      }

      for (let i = 0; i < 360; i += 2) {
        const isMajor = (i % 10 === 0);
        const rStart = isMajor ? 275 : 283;
        const p1 = polarToCartesian(cx, cy, rStart, i);
        const p2 = polarToCartesian(cx, cy, 290, i);

        const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
        tick.setAttribute("x1", p1.x);
        tick.setAttribute("y1", p1.y);
        tick.setAttribute("x2", p2.x);
        tick.setAttribute("y2", p2.y);
        tick.setAttribute("stroke", isMajor ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.1)");
        tick.setAttribute("stroke-width", isMajor ? "1.5" : "0.8");
        tickGroup.appendChild(tick);
      }
    }

    function updateDisplayValues(date) {
      document.getElementById("val-year").textContent = date.getFullYear();
      document.getElementById("val-month").textContent = String(date.getMonth() + 1).padStart(2, '0');
      document.getElementById("val-day").textContent = String(date.getDate()).padStart(2, '0');
      document.getElementById("val-hour").textContent = String(date.getHours()).padStart(2, '0');
      document.getElementById("val-minute").textContent = String(date.getMinutes()).padStart(2, '0');
      document.getElementById("val-second").textContent = String(date.getSeconds()).padStart(2, '0');
    }

    function renderAstroclockAt(date) {
      const jd = getJulianDate(date);
      const ayanamsha = getLahiriAyanamsha(jd);

      const sunTrop = getSunTropicalPosition(jd);
      const moonTrop = getMoonTropicalPosition(jd);
      const ascTrop = getAscendantTropical(jd, observerLat, observerLon);

      const sunSid = (sunTrop - ayanamsha + 360) % 360;
      const moonSid = (moonTrop - ayanamsha + 360) % 360;
      const ascSid = (ascTrop - ayanamsha + 360) % 360;

      const phaseAngle = (moonTrop - sunTrop + 360) % 360;
      const moonPathElem = document.getElementById("moon-phase-path");
      if (moonPathElem) {
        moonPathElem.setAttribute("d", getMoonPhasePath(phaseAngle));
      }

      document.getElementById("hand-sun").setAttribute("transform", `rotate(${sunSid}, 400, 400)`);
      document.getElementById("hand-moon").setAttribute("transform", `rotate(${moonSid}, 400, 400)`);
      document.getElementById("hand-asc").setAttribute("transform", `rotate(${ascSid}, 400, 400)`);

      const pad = (n) => String(n).padStart(2, '0');
      const timeStr = `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
      const ascLabel = document.getElementById("asc-time-label");
      if (ascLabel) {
        ascLabel.textContent = timeStr;
        const textPos = polarToCartesian(400, 400, 460, ascSid);
        ascLabel.setAttribute("x", textPos.x);
        ascLabel.setAttribute("y", textPos.y);
        const rot = ascSid > 90 && ascSid < 270 ? ascSid + 180 : ascSid;
        ascLabel.setAttribute("transform", `rotate(${rot}, ${textPos.x}, ${textPos.y})`);
      }

      const sunriseHour = getSunriseHour(jd, observerLat, observerLon);
      const ringRotation = sunSid - (sunriseHour * 15);

      if (lastRingRotation === null || Math.abs(ringRotation - lastRingRotation) > 0.5) {
        for (let i = 0; i < 24; i++) {
          const startDeg = i * 15;
          const midDeg = startDeg + 7.5;
          const globalPosAngle = (midDeg + ringRotation) % 360;
          const rot = (globalPosAngle > 90 && globalPosAngle < 270) ? midDeg + 180 : midDeg;
          const tText = document.getElementById(`time-text-${i}`);
          if (tText) {
            const textPos = polarToCartesian(400, 400, 421.5, midDeg);
            tText.setAttribute("transform", `rotate(${rot}, ${textPos.x}, ${textPos.y})`);
          }
        }
        lastRingRotation = ringRotation;
      }

      document.getElementById("time-ring").setAttribute("transform", `rotate(${ringRotation}, 400, 400)`);

      document.getElementById("sun-pos").textContent = formatSiderealPos(sunSid);
      document.getElementById("moon-pos").textContent = formatSiderealPos(moonSid);
      document.getElementById("asc-pos").textContent = formatSiderealPos(ascSid);
      document.getElementById("ayanamsha-val").textContent = `${ayanamsha.toFixed(2)}°`;
      
      updateDisplayValues(date);

      const localAscAngle = ((ascSid - ringRotation) % 360 + 360) % 360;
      const currentAscHourIndex = Math.floor(localAscAngle / 15) % 24;

      const currentMonthIndex = date.getMonth();
      const currentZodiacIndex = Math.floor(sunSid / 30) % 12;
      const currentNakshatraIndex = Math.floor(moonSid / (360 / 27)) % 27;

      for (let i = 0; i < 24; i++) {
        const isCurrentAsc = (i === currentAscHourIndex);
        const tBg = document.getElementById(`time-bg-${i}`);
        tBg.setAttribute("fill", isCurrentAsc ? "rgba(255, 71, 87, 0.15)" : "rgba(0, 0, 0, 0)");
        tBg.setAttribute("stroke", isCurrentAsc ? "#ff4757" : "none");
        tBg.setAttribute("stroke-width", isCurrentAsc ? "1" : "0");

        const tText = document.getElementById(`time-text-${i}`);
        tText.setAttribute("fill", isCurrentAsc ? "#ff4757" : "#94a3b8");
        tText.setAttribute("font-weight", isCurrentAsc ? "bold" : "600");
      }

      for (let i = 0; i < 12; i++) {
        const isCurrentMonth = (i === currentMonthIndex);
        const gPath = document.getElementById(`greg-month-path-${i}`);
        gPath.setAttribute("fill", isCurrentMonth ? "rgba(243, 186, 47, 0.2)" : (i % 2 === 0 ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.06)"));
        gPath.setAttribute("stroke", isCurrentMonth ? "#f3ba2f" : "rgba(255,255,255,0.2)");
        gPath.setAttribute("stroke-width", isCurrentMonth ? "2" : "1");

        const gText = document.getElementById(`greg-month-text-${i}`);
        gText.setAttribute("fill", isCurrentMonth ? "#f3ba2f" : "#a0aec0");
        gText.setAttribute("font-weight", isCurrentMonth ? "bold" : "normal");

        const isCurrentZod = (i === currentZodiacIndex);
        const zPath = document.getElementById(`zod-path-${i}`);
        zPath.setAttribute("stroke", isCurrentZod ? "#f3ba2f" : "rgba(255,255,255,0.15)");
        zPath.setAttribute("stroke-width", isCurrentZod ? "2" : "1");

        const zMlText = document.getElementById(`zod-ml-${i}`);
        zMlText.setAttribute("fill", isCurrentZod ? "#f3ba2f" : "#e2e8f0");
        zMlText.setAttribute("font-weight", isCurrentZod ? "bold" : "normal");

        const zSymText = document.getElementById(`zod-sym-${i}`);
        zSymText.setAttribute("fill", isCurrentZod ? "#f3ba2f" : "#ffffff");
      }

      for (let i = 0; i < 27; i++) {
        const isCurrentNak = (i === currentNakshatraIndex);
        const nBg = document.getElementById(`nak-bg-${i}`);
        nBg.setAttribute("fill", isCurrentNak ? "rgba(0, 240, 255, 0.2)" : "rgba(0, 240, 255, 0)");
        nBg.setAttribute("stroke", isCurrentNak ? "#00f0ff" : "none");
        nBg.setAttribute("stroke-width", isCurrentNak ? "1" : "0");

        const nText = document.getElementById(`nak-text-${i}`);
        nText.setAttribute("fill", isCurrentNak ? "#ffffff" : "#00f0ff");
      }
    }

    function adjustTimeUnit(unit, delta) {
      isRealtime = false;
      let y = customTime.getFullYear();
      let m = customTime.getMonth();
      let d = customTime.getDate();
      let h = customTime.getHours();
      let min = customTime.getMinutes();
      let s = customTime.getSeconds();

      if (unit === 'year') y += delta;
      if (unit === 'month') m += delta;
      if (unit === 'day') d += delta;
      if (unit === 'hour') h += delta;
      if (unit === 'minute') min += delta;
      if (unit === 'second') s += delta;

      customTime = new Date(y, m, d, h, min, s);
      renderAstroclockAt(customTime);
    }

    function init() {
      buildZodiacClockUI();
      customTime = new Date();
      renderAstroclockAt(customTime);

      setInterval(() => {
        if (isRealtime) {
          customTime = new Date();
          renderAstroclockAt(customTime);
        }
      }, 1000);

      document.querySelectorAll(".dt-col").forEach(col => {
        const unit = col.getAttribute("data-unit");
        
        col.addEventListener("wheel", (e) => {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 1 : -1;
          adjustTimeUnit(unit, delta);
        }, { passive: false });

        col.querySelector(".btn-plus").addEventListener("click", () => {
          adjustTimeUnit(unit, 1);
        });

        col.querySelector(".btn-minus").addEventListener("click", () => {
          adjustTimeUnit(unit, -1);
        });
      });

      document.getElementById("btn-live").addEventListener("click", () => {
        isRealtime = true;
        customTime = new Date();
        renderAstroclockAt(customTime);
      });
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
